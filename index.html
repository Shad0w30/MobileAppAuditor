<!DOCTYPE html>
<html>
<head>
  <title>Mobile App Analyzer – iOS IPA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>📱 iOS IPA Static Analyzer (Client-Side)</h2>

<input type="file" id="ipaInput" accept=".ipa" />

<div class="container">
  <div class="panel" id="fileTree"></div>
  <div class="panel" id="fileViewer">Select a file</div>
</div>

<h3>📌 Application Details</h3>
<pre id="appDetails"></pre>

<h3>🚨 OWASP MASVS Findings</h3>
<div id="dashboard"></div>

<script src="libs/jszip.min.js"></script>
<script src="libs/plist.min.js"></script>

<script type="module" src="app.js"></script>
</body>
</html>
